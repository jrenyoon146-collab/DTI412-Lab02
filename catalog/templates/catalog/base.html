<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }

        nav {
            background-color: #212529;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        nav a:hover {
            color: #0d6efd;
        }

        .container {
            padding: 30px;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'catalog:home' %}">Home</a>
        <a href="{% url 'catalog:course_list' %}">Courses</a>
        <a href="{% url 'catalog:inquiry' %}">Inquiry</a>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        © 2026 Department of Information Technology
    </footer>

</body>
</html>
